<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodotti in base alla categoria</title>
    <link rel="stylesheet" href="/Categoria_prodotti/style.css">
</head>

<body>
    <button id="fetchButton" type="button">
        Aggiorna dati
    </button>

    <span id="lastUpdate"></span>
    <div id="statusMessage"></div>

    <hr>

    <h1>Prodotti in base alla categoria</h1>

    <form id="formAggiungi">

        <h2>Aggiungi un nuovo prodotto</h2>

        <label for="nome">Nome prodotto</label>
        <input type="text" id="nome" required>

        <label for="prezzo">Prezzo</label>
        <input
            type="number"
            id="prezzo"
            min="0"
            required
        >

        <label for="quantita">Quantità</label>
        <input
            type="number"
            id="quantita"
            min="0"
            required
        >

        <label for="categoria_id">ID categoria</label>
        <input
            type="number"
            id="categoria_id"
            min="1"
            required
        >

        <button type="submit">
            Aggiungi prodotto
        </button>

    </form>
    <hr>
    <form id="formElimina">

        <h2>Elimina un prodotto</h2>

        <label for="prodotto_id">ID prodotto</label>
        <input
            type="number"
            id="prodotto_id"
            min="1"
            required
        >

        <button type="submit">
            Elimina prodotto
        </button>

    </form>
    <hr>
    <form id="formRicerca">

        <h2>Ricerca prodotti</h2>

        <div id="searchContainer">
            <label for="search">Cerca prodotto</label>
            <input type="text" id="search">
        </div>

        <div id="filtroContainer">
            <label for="filtroNome">Cerca per nome</label>
            <input type="text" id="filtroNome">
        </div>

        <div id="filtroContainer">
            <label for="filtroId">Cerca per ID</label>
            <input type="number" id="filtroId">
        </div>

        <div id="filtroContainer">
            <label for="filtroPrezzo">Prezzo</label>
            <input
                type="number"
                id="filtroPrezzo"
                min="0"
            >
        </div>
        
        <div id="filtroContainer">
            <label for="filtroQuantita">Quantità</label>
            <input
                type="number"
                id="filtroQuantita"
                min="0"
            >
        </div>

        <button type="button" id="ricercaProdotto">
            Ricerca
        </button>

    </form>

    <hr>

    <pre id="risultato"></pre>
    <script src="/Categoria_prodotti/script.js"></script>

</body>
</html>
