<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodotti categoria</title>

    <link rel="stylesheet" href="/Categoria_prodotti/style.css">
</head>

<body>
    <h1>Prodotti della categoria</h1>
    <form id="formProdotto">

        <label for="nome">Nome prodotto</label>
        <input
            type="text"
            id="nome"
            required
        >

        <label for="prezzo">Prezzo</label>
        <input
            type="number"
            id="prezzo"
            required
        >

        <label for="quantita">Quantità</label>
        <input
            type="number"
            id="quantita"
            required
        >

        <label for="categoria_id">ID categoria</label>
        <input
            type="number"
            id="categoria_id"
        >

        <button type="submit">
            Aggiungi prodotto
        </button>

    </form>

    <pre id="risultato"></pre>
    <script src="/Categoria_prodotti/script.js"></script>

</body>
</html>
