<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodotti in base alla categoria</title>
    <link rel="stylesheet" href="/Categoria_prodotti/style.css">
</head>

<body>
    <h1>Prodotti in base alla categoria</h1>

    <form id="formAggiungi">
        <h2>Aggiungi un nuovo prodotto</h2>
        <label for="nome">Nome prodotto</label>
        <input type="text" id="nome" required>

        <label for="prezzo">Prezzo</label>
        <input type="number" id="prezzo" required>

        <label for="quantita">Quantità</label>
        <input type="number" id="quantita" required>

        <label for="categoria_id">ID categoria</label>
        <input type="number" id="categoria_id" required>

        <button type="submit" id="aggiungiProdotto">Aggiungi prodotto</button>
    </form>

    <hr>

    <form id="formElimina">
        <h2>Elimina un prodotto</h2>
        
        <label for="prodotto_id">ID prodotto</label>
        <input type="number" id="prodotto_id" required>

        <button type="submit" id="eliminaProdotto">Elimina prodotto</button>
    </form>

    <pre id="risultato"></pre>
    <script src="/Categoria_prodotti/script.js"></script>
</body>
</html>
